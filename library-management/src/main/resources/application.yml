server:
  port: 8080

spring:
  application:
    name: library-management
  # 数据库连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ll521521
# MyBatis-Plus 基础配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lushengyao.library.entity
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线自动映射实体类驼峰属性
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印完整SQL语句，开发调试必备