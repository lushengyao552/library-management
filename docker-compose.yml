# 智学伴一键部署
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ll521521
      MYSQL_DATABASE: library_db
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/db/migration-v2.sql:/docker-entrypoint-initdb.d/02-migration.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    ports: ["6379:6379"]

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ll521521
      SPRING_DATA_REDIS_HOST: redis
    depends_on: [mysql, redis]

  web:
    build: ./web
    ports: ["80:80"]
    depends_on: [app]

volumes:
  mysql_data:
