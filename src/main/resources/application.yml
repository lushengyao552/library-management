server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: library-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ll521521}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  ai:
    openai:
      api-key: ${AI_API_KEY:QDBXOAbLcLXCWUFPgUQdSZErH8bbwcRPraIe4-I_yPg}
      base-url: ${AI_BASE_URL:https://zhenze-huhehaote.cmecloud.cn/v1}
      chat:
        options:
          model: ${AI_MODEL:deepseek-v3.2}
          temperature: 0.7
          max-tokens: 2048

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.example.library: DEBUG

library:
  scenario:
    items:
      - code: self-study
        name: 技能自学
        question-count: 5
        review-type: FREE_PRACTICE
        book-category-ids: [1]
        max-points: 12
      - code: reading
        name: 阅读计划
        question-count: 3
        review-type: RETELL
        book-category-ids: [2]
        max-points: 10
  model:
    price:
      strong-input-per-1k: 0.0028
      strong-output-per-1k: 0.0084
      weak-input-per-1k: 0.0006
      weak-output-per-1k: 0.0018
  jwt:
    secret: ${JWT_SECRET:library-management-secret-key-2024-please-change-in-production}
    expiration: 86400000
    header: Authorization
    prefix: "Bearer "
  borrow:
    max-days: 30
    max-count: 5

knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
